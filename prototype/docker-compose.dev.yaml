# The machine's one dev stack, shared by every worktree: Postgres (with proto, the neutralized copy
# of the deployed instance that dev-pull.sh writes), the filestore volume and the image. Never `up`
# the odoo services: odoo is for builds and one-off runs (dev-pull.sh), odoo-test for scripts/test.sh.
# Each worktree serves its own copy of proto from docker-compose.worktree.yaml, through scripts/dev.sh.
# The image pins the same Odoo and addons commits as the deployed one; addons/ is mounted live as pcp.
name: pcp-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment: &odoo-env
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
      ADMIN_PASSWD: dev
      # A run that sets AUTO_UPDATE_DB (dev-pull.sh, on proto) upgrades, then neutralizes, that db
      # first (entrypoint.sh): it is a copy of the deployed one.
      NEUTRALIZE: "1"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/opt/odoo-addons/pcp:ro

  # The odoo image plus a browser for HttpCase tours (Dockerfile.test, built by scripts/test.sh),
  # with test-addons/ on its addons path.
  odoo-test:
    image: pcp-dev-odoo-test
    pull_policy: never
    # Odoo as PID 1 would not reap the processes Chrome leaves (chrome_crashpad), and a test fails on
    # a leftover child process.
    init: true
    environment: *odoo-env
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/opt/odoo-addons/pcp:ro
      - ./test-addons:/opt/odoo-addons/pcp-test:ro

volumes:
  db-data:
  odoo-data:
