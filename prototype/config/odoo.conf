[options]
; paths inside the image; repos are cloned by the Dockerfile into /mnt/extra-addons/<repo>
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/odoo-argentina-ce,/mnt/extra-addons/odoo-argentina,/mnt/extra-addons/account-payment,/mnt/extra-addons/account-financial-tools,/mnt/extra-addons/account-invoicing,/mnt/extra-addons/oca-reporting-engine,/mnt/extra-addons/pcp
data_dir = /var/lib/odoo

; db connection comes from env: HOST, PORT, USER, PASSWORD (odoo image entrypoint reads them)
list_db = True
; set a real password via env ADMIN_PASSWD before exposing this publicly
admin_passwd = change-me

; behind Coolify's Traefik. Threaded mode (workers = 0) so the websocket is served on 8069
; and Coolify only needs to route one port. Switch to workers > 0 with a /websocket -> 8072
; Traefik rule when this becomes the real deployment.
proxy_mode = True
http_interface = 0.0.0.0
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

log_level = info
